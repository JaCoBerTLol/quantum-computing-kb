<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>量子计算知识库 | Quantum Computing KB</title>
  <meta name="description" content="量子计算知识库 — 涵盖基础原理、硬件技术路线、量子算法、软件工具、纠错容错、产业生态、应用场景与发展趋势">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div class="app">
    <header class="header">
      <div class="header-hero">
        <div class="atom-decoration">
          <svg viewBox="0 0 120 120">
            <g class="atom-orbit">
              <ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
              <circle cx="112" cy="60" r="3.5" fill="#7c3aed"/>
            </g>
            <g class="atom-orbit" transform="rotate(60 60 60)">
              <ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
              <circle cx="112" cy="60" r="3.5" fill="#2563eb"/>
            </g>
            <g class="atom-orbit" transform="rotate(120 60 60)">
              <ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.5"/>
              <circle cx="112" cy="60" r="3.5" fill="#0891b2"/>
            </g>
            <circle cx="60" cy="60" r="8" fill="url(#nucleus)"/>
            <circle cx="60" cy="60" r="4" fill="#fff" opacity="0.6"/>
            <defs>
              <radialGradient id="nucleus">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#7c3aed"/>
              </radialGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <h1>量子计算知识库</h1>
          <p class="subtitle">Quantum Computing Knowledge Base</p>
        </div>
      </div>

      <div class="header-wave">
        <svg viewBox="0 0 500 30" preserveAspectRatio="none">
          <path class="wave-path" d="M0,15 Q62.5,0 125,15 T250,15 T375,15 T500,15" fill="none" stroke="url(#wave-grad)" stroke-width="2" stroke-linecap="round"/>
          <path class="wave-path" d="M0,15 Q62.5,30 125,15 T250,15 T375,15 T500,15" fill="none" stroke="url(#wave-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <defs>
            <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
              <stop offset="50%" stop-color="#2563eb" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#0891b2" stop-opacity="0.3"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <p class="header-desc">涵盖基础原理 · 硬件技术路线 · 量子算法 · 软件工具 · 纠错容错 · 产业生态 · 应用场景 · 发展趋势 · 行业热点 · 关键人物 · 术语表</p>
    </header>

    <!-- ===== 搜索区 ===== -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-5-5m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" placeholder="输入关键词搜索，如：量子比特、Shor算法、龙头、超导、纠错..." autocomplete="off">
        <button class="clear-btn" id="clearBtn" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M6 18L18 6"/>
          </svg>
        </button>
        <button class="random-btn" id="randomBtn" onclick="randomKnowledge()" title="随机推荐一条知识">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
          </svg>
        </button>
      </div>
      <div class="suggestions" id="suggestions" style="display:none"></div>
    </section>

    <!-- ===== 热门资讯卡片 ===== -->
    <section class="hot-news-section">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align:middle;margin-right:6px">
            <path fill="#ea580c" d="M12 23c0-4.5 3.5-9 8-9.5-1 6.5-4 10-8 9.5zM12 23c0-4.5-3.5-9-8-9.5 1 6.5 4 10 8 9.5zM12 23c0-6-2-11-6-14 2 5 0 9-3 11 0 3 2 5 9 3zM12 23c0-6 2-11 6-14-2 5 0 9 3 11 0 3-2 5-9 3z"/>
          </svg>
          行业热点
        </h2>
        <span class="section-subtitle">最新突破与行业动态</span>
      </div>
      <div class="hot-news-grid" id="hotNews"></div>
    </section>

    <!-- ===== 发展时间线 ===== -->
    <section class="timeline-section">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align:middle;margin-right:6px">
            <path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          量子计算发展历程
        </h2>
      </div>
      <div class="timeline-nav">
        <button class="timeline-nav-btn" id="timelinePrev">←</button>
        <button class="timeline-nav-btn" id="timelineNext">→</button>
      </div>
      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline-track" id="timeline"></div>
      </div>
    </section>

    <!-- ===== Bloch球交互式可视化 ===== -->
    <section class="bloch-section">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align:middle;margin-right:6px">
            <circle cx="12" cy="12" r="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
            <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
            <line x1="12" y1="2" x2="12" y2="22" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
          </svg>
          量子比特可视化 — Bloch球
        </h2>
        <span class="section-subtitle">点击量子门按钮观察态变化</span>
      </div>
      <div class="bloch-wrapper" id="blochSphere"></div>
    </section>

    <!-- ===== 分类导航 ===== -->
    <nav class="categories" id="categories"></nav>

    <div class="results-meta">
      <span id="resultCount" class="result-count"></span>
      <span class="last-updated" id="lastUpdated"></span>
    </div>

    <main class="results" id="results">
      <div class="loading">
        <div class="loader"></div>
        <p>正在加载知识库...</p>
      </div>
    </main>

    <footer class="footer">
      <p>量子计算知识库 · 共 <span id="totalEntries">0</span> 条知识 · 基于 HTML/CSS/JS 构建</p>
      <p class="footer-note">可通过 GitHub Pages 免费部署，生成公开链接供任何人访问</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
