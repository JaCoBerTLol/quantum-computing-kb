name: 量子行业资讯每3天更新

on:
  schedule:
    # 每3天北京时间 8:00 执行 (UTC 0:00)
    # 1日、4日、7日、10日、13日、16日、19日、22日、25日、28日
    - cron: '0 0 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Run news scraper
        run: python scripts/scrape_news.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/news-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 量子行业资讯每3天自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
